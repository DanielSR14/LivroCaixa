name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/LivroCaixa.sln

      - name: Check for vulnerable packages
        shell: pwsh
        run: |
          $output = dotnet list src/LivroCaixa.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $output
          if ($output -match "has the following vulnerable packages") {
            Write-Error "Pacotes NuGet vulneraveis encontrados - ver saida acima. Corrigir antes de seguir (ver SEGURANCA.md, secao 1)."
            exit 1
          }

      - name: Build
        run: dotnet build src/LivroCaixa.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test src/LivroCaixa.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"
